name: Finalize Frontend E0

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-frontend-e0.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-and-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: servico-palavra/apps/web/package-lock.json

      - name: Refresh lockfile
        working-directory: servico-palavra/apps/web
        run: npm install

      - name: Audit production dependencies
        working-directory: servico-palavra/apps/web
        run: npm audit --omit=dev --audit-level=high

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Install Chromium
        working-directory: servico-palavra/apps/web
        run: npx playwright install --with-deps chromium

      - name: E2E smoke
        run: npm run test:e2e

      - name: Persist validated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add servico-palavra/apps/web/package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: refresh frontend dependency lock"
          git push origin HEAD:main
