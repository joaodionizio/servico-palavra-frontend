name: Prepare Frontend E0

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prepare-frontend-e0.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: servico-palavra/apps/web/package-lock.json

      - name: Add quality dependencies
        working-directory: servico-palavra/apps/web
        run: npm install --save-dev eslint eslint-config-next@16.2.7 @playwright/test

      - name: Configure package scripts
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const appPath = 'servico-palavra/apps/web/package.json';
          const app = JSON.parse(fs.readFileSync(appPath, 'utf8'));
          app.scripts = {
            ...app.scripts,
            typecheck: 'tsc --noEmit',
            lint: 'eslint .',
            'test:e2e': 'playwright test',
            test: 'npm run test:e2e',
            verify: 'npm run typecheck && npm run lint && npm run build && npm run test:e2e'
          };
          fs.writeFileSync(appPath, JSON.stringify(app, null, 2) + '\n');

          const rootPath = 'package.json';
          const root = JSON.parse(fs.readFileSync(rootPath, 'utf8'));
          root.scripts = {
            ...root.scripts,
            typecheck: 'npm --prefix servico-palavra/apps/web run typecheck',
            lint: 'npm --prefix servico-palavra/apps/web run lint',
            'test:e2e': 'npm --prefix servico-palavra/apps/web run test:e2e',
            test: 'npm run test:e2e',
            verify: 'npm --prefix servico-palavra/apps/web run verify'
          };
          fs.writeFileSync(rootPath, JSON.stringify(root, null, 2) + '\n');
          NODE

      - name: Write ESLint config
        working-directory: servico-palavra/apps/web
        run: |
          cat > eslint.config.mjs <<'EOF'
          import { defineConfig, globalIgnores } from "eslint/config";
          import nextVitals from "eslint-config-next/core-web-vitals";

          const eslintConfig = defineConfig([
            ...nextVitals,
            globalIgnores([".next/**", "out/**", "build/**", "next-env.d.ts", "playwright-report/**", "test-results/**"])
          ]);

          export default eslintConfig;
          EOF

      - name: Write Playwright config
        working-directory: servico-palavra/apps/web
        run: |
          cat > playwright.config.ts <<'EOF'
          import { defineConfig, devices } from "@playwright/test";

          export default defineConfig({
            testDir: "./tests/e2e",
            fullyParallel: true,
            forbidOnly: Boolean(process.env.CI),
            retries: process.env.CI ? 1 : 0,
            workers: process.env.CI ? 1 : undefined,
            reporter: process.env.CI ? "line" : "list",
            use: {
              baseURL: "http://127.0.0.1:3000",
              trace: "retain-on-failure",
              screenshot: "only-on-failure"
            },
            projects: [
              {
                name: "chromium",
                use: { ...devices["Desktop Chrome"] }
              }
            ],
            webServer: {
              command: "NEXT_PUBLIC_API_URL=/mock-api npm run dev -- --hostname 127.0.0.1 --port 3000",
              url: "http://127.0.0.1:3000/login",
              reuseExistingServer: !process.env.CI,
              timeout: 120_000
            }
          });
          EOF

      - name: Write E2E smoke tests
        working-directory: servico-palavra/apps/web
        run: |
          mkdir -p tests/e2e
          cat > tests/e2e/smoke.spec.ts <<'EOF'
          import { expect, test, type Page, type Route } from "@playwright/test";

          const usuario = {
            id: "00000000-0000-0000-0000-000000000001",
            nome: "Pessoa Teste",
            email: "teste@example.com",
            roles: []
          };

          const dashboard = {
            conteudosConcluidos: 0,
            favoritos: 0,
            possuiPlanoBiblicoAtivo: false,
            formacoesRecentes: [],
            favoritosRecentes: [],
            conteudosComProgresso: [],
            planoBiblicoAtivo: null,
            leituraHoje: null,
            estatisticas: {
              totalFavoritos: 0,
              totalConteudosConcluidos: 0,
              percentualPlanoBiblico: 0
            }
          };

          async function json(route: Route, body: unknown, status = 200) {
            await route.fulfill({
              status,
              contentType: "application/json",
              body: JSON.stringify(body)
            });
          }

          async function mockApi(page: Page, authenticated = true) {
            await page.route("**/mock-api/**", async (route) => {
              const request = route.request();
              const path = new URL(request.url()).pathname;

              if (path.endsWith("/api/auth/csrf")) {
                return json(route, { success: true, data: { token: "test-csrf-token" } });
              }

              if (path.endsWith("/api/auth/login") && request.method() === "POST") {
                return json(route, { success: true, data: { usuario } });
              }

              if (path.endsWith("/api/auth/me")) {
                return authenticated
                  ? json(route, { success: true, data: usuario })
                  : json(route, { success: false, message: "Sessão expirada." }, 401);
              }

              if (path.endsWith("/api/dashboard/me")) {
                return json(route, { success: true, data: dashboard });
              }

              if (path.endsWith("/api/auth/logout")) {
                return json(route, { success: true });
              }

              return json(route, { success: true, data: [] });
            });
          }

          async function signIn(page: Page) {
            await mockApi(page, true);
            await page.goto("/login");
            await page.getByPlaceholder("Seu email").fill("teste@example.com");
            await page.getByPlaceholder("Sua senha").fill("senha-teste");
            await page.getByRole("button", { name: "Entrar" }).click();
            await expect(page).toHaveURL(/\/app(?:$|[/?#])/, { timeout: 15_000 });
            await expect(page.getByRole("heading", { name: "Sua jornada de formação" })).toBeVisible();
          }

          test("login autenticado chega ao dashboard com API mockada", async ({ page }) => {
            await signIn(page);
          });

          test("menu móvel abre e expõe a navegação principal", async ({ page }) => {
            await page.setViewportSize({ width: 390, height: 844 });
            await signIn(page);
            await page.getByRole("button", { name: "Abrir menu" }).click();
            await expect(page.getByRole("link", { name: "Início" })).toBeVisible();
            await expect(page.getByRole("link", { name: "Formações" })).toBeVisible();
          });

          test("rota protegida redireciona para login quando a sessão expira", async ({ page }) => {
            await mockApi(page, false);
            await page.goto("/app");
            await expect(page).toHaveURL(/\/login\?/, { timeout: 10_000 });
          });

          for (const viewport of [
            { width: 320, height: 568 },
            { width: 390, height: 844 },
            { width: 768, height: 1024 },
            { width: 1024, height: 768 },
            { width: 1440, height: 900 }
          ]) {
            test(`login sem overflow horizontal em ${viewport.width}px`, async ({ page }) => {
              await page.setViewportSize(viewport);
              await page.goto("/login");
              await expect(page.getByPlaceholder("Seu email")).toBeVisible();
              await expect(page.getByRole("button", { name: "Entrar" })).toBeVisible();

              const overflow = await page.evaluate(() =>
                document.documentElement.scrollWidth > document.documentElement.clientWidth + 1
              );
              expect(overflow).toBe(false);
            });
          }
          EOF

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Install Chromium
        working-directory: servico-palavra/apps/web
        run: npx playwright install --with-deps chromium

      - name: E2E smoke
        run: npm run test:e2e

      - name: Commit validated E0 files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            package.json \
            servico-palavra/apps/web/package.json \
            servico-palavra/apps/web/package-lock.json \
            servico-palavra/apps/web/eslint.config.mjs \
            servico-palavra/apps/web/playwright.config.ts \
            servico-palavra/apps/web/tests/e2e/smoke.spec.ts
          git diff --cached --quiet && exit 0
          git commit -m "test: add frontend quality gate foundation"
          git push origin HEAD:main
