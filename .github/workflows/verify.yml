name: Frontend Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: servico-palavra/apps/web/package-lock.json

      - name: Install dependencies
        working-directory: servico-palavra/apps/web
        run: npm ci

      - name: Audit production dependencies
        working-directory: servico-palavra/apps/web
        run: npm audit --omit=dev --audit-level=high

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Install Chromium
        working-directory: servico-palavra/apps/web
        run: npx playwright install --with-deps chromium

      - name: E2E — autenticação
        working-directory: servico-palavra/apps/web
        run: npx playwright test --grep "login usa|logout navega|menu móvel|rota protegida"

      - name: E2E — recuperação
        working-directory: servico-palavra/apps/web
        run: npx playwright test --grep "recuperacao|solicitacao|reset valido|token de reset|token invalido|link sem parametros|senhas divergentes"

      - name: E2E — responsividade
        working-directory: servico-palavra/apps/web
        run: npx playwright test --grep "sem overflow"
