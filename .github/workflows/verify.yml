name: Frontend Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: servico-palavra/apps/web/package-lock.json

      - name: Install dependencies
        working-directory: servico-palavra/apps/web
        run: npm ci

      - name: Audit production dependencies
        working-directory: servico-palavra/apps/web
        run: npm audit --omit=dev --audit-level=high

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Install Chromium
        working-directory: servico-palavra/apps/web
        run: npx playwright install --with-deps chromium

      - name: E2E — autenticação
        working-directory: servico-palavra/apps/web
        run: npx playwright test --grep "login usa|logout navega|menu móvel|rota protegida"

      - name: E2E — recuperação / solicitação
        working-directory: servico-palavra/apps/web
        run: npx playwright test --grep "login oferece acesso|solicitacao"

      - name: E2E — reset / sucesso
        working-directory: servico-palavra/apps/web
        run: npx playwright test --grep "reset valido"

      - name: E2E — reset / token inválido
        working-directory: servico-palavra/apps/web
        run: npx playwright test --grep "token invalido"

      - name: E2E — reset / parâmetros ausentes
        working-directory: servico-palavra/apps/web
        run: npx playwright test --grep "link sem parametros"

      - name: E2E — reset / senhas divergentes
        working-directory: servico-palavra/apps/web
        run: npx playwright test --grep "senhas divergentes"

      - name: E2E — recuperação / segurança e motion
        working-directory: servico-palavra/apps/web
        run: npx playwright test --grep "token de reset|preserva dark mode"

      - name: E2E — responsividade
        working-directory: servico-palavra/apps/web
        run: npx playwright test --grep "sem overflow"

      - name: E2E — acessibilidade / drawer
        working-directory: servico-palavra/apps/web
        run: npx playwright test tests/e2e/accessibility.spec.ts --grep "drawer móvel"

      - name: E2E — acessibilidade / diálogo
        working-directory: servico-palavra/apps/web
        run: npx playwright test tests/e2e/accessibility.spec.ts --grep "diálogo mensal"
